<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Boule">
  <title>Boule — two tallies and the gap between them</title>
  <!-- paper ground -->
  <rect width="512" height="512" fill="#FAF9F6"/>
  <!-- the OFFICIAL tally: the taller rule -->
  <rect x="150" y="128" width="80" height="246" fill="#14130F"/>
  <!-- OUR tally: shorter, and that is the whole point -->
  <rect x="282" y="192" width="80" height="182" fill="#14130F"/>
  <!-- the public level, marked in signal. Drawn ACROSS both rules, so what stands
       above it is exactly the gap. At the tall bar's top it read as a lid. -->
  <rect x="150" y="192" width="212" height="10" fill="#C8442A"/>
  <!-- the baseline both tallies stand on -->
  <rect x="150" y="374" width="212" height="10" fill="#14130F"/>
</svg>
